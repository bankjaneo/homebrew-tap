name: Autoupdate caprine cask

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update cask to latest caprine release
        run: node scripts/autoupdate.mjs || echo "::notice::No update needed"
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          version=$(grep -o 'version "[^"]*"' Casks/caprine.rb | head -1 | cut -d'"' -f2)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/caprine.rb
          git commit -m "Update caprine to $version"
          git push
